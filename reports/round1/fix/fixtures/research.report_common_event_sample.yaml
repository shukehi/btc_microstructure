acceptance_targets:
  continuous_run_hours: 24
  core_valid_coverage_fraction: 0.99
  feature_publish_lag_p99_ms: 1000
  status: NOT_RUN
  unflagged_known_gaps: 0
collector:
  checkpoint_seconds: 60
  connection_rotate_seconds: 82800
  endpoint_budget_file: null
  funding_history_check_seconds: 300
  funding_info_refresh_seconds: 900
  max_concurrent_oi_requests: 1
  metadata_refresh_seconds: 3600
  oi_poll_seconds: 5
  protocol_probe_completed: false
  protocol_probe_required: true
  queue_max_bytes: 268435456
  queue_max_records: 100000
  queue_warning_fraction: 0.8
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 60
  snapshot_limit: 1000
cost_analysis:
  enabled: false
  entry_fee_rate: null
  entry_latency_ms: null
  execution_model: taker_quote_or_validated_l2
  exit_fee_rate: null
  exit_latency_ms: null
  extra_slippage_bps: null
  funding_model: actual_crossed_settlement_events
  missing_cost_policy: block_net_result
  position_quantity_btc: null
endpoints:
  spot_rest: https://api.binance.com
  spot_ws: wss://stream.binance.com:9443/stream
  um_market_ws: wss://fstream.binance.com/market/stream
  um_public_ws: wss://fstream.binance.com/public/stream
  um_rest: https://fapi.binance.com
features:
  cvd_reset: utc_day_or_new_continuous_segment
  depth_bps:
  - 5
  - 10
  - 25
  grid_seconds: 1
  ofi_lookbacks_seconds:
  - 1
  - 5
  - 30
  - 60
  ofi_source: validated_standard_l2_observations
  oi_lookbacks_seconds:
  - 30
  - 60
  - 300
  - 900
  optional_time_views:
  - event_time_revised
  quantile_method: linear
  rolling_std_ddof: 1
  settled_funding_z_lookback_days: 30
  settled_funding_z_min_unique_events: 30
  settled_funding_z_same_interval_only: true
  time_view: as_received
  trade_lookbacks_seconds:
  - 1
  - 5
  - 30
  - 60
  - 300
  - 900
  window_boundary: left_closed_right_open
instruments:
  perpetual:
    expected_base_asset: BTC
    expected_contract_type: PERPETUAL
    expected_margin_asset: USDT
    expected_quote_asset: USDT
    market_type: um_perpetual
    oi_unit: UNKNOWN
    symbol: BTCUSDT
    unit_evidence_id: null
    venue: binance
  spot:
    expected_base_asset: BTC
    expected_quote_asset: USDT
    market_type: spot
    symbol: BTCUSDT
    venue: binance
project:
  automatic_trading: false
  language: zh-CN
  mode: research_read_only
  name: btc_microstructure
  timezone: UTC
quality:
  clock_uncertain_disables_lead_lag: true
  known_gap_invalidates_flow_window: true
  max_bbo_age_ms: 2000
  max_book_age_ms: 2000
  max_cross_market_quote_skew_ms: 1000
  max_mark_index_age_ms: 5000
  max_oi_poll_age_ms: 15000
  max_oi_source_observation_age_ms: 30000
  require_complete_book_price_band: true
  require_complete_path_for_mfe_mae: true
  unknown_as_null: true
research:
  horizon_seconds:
  - 5
  - 10
  - 30
  - 60
  - 180
  - 300
  - 900
  - 1800
  - 3600
  - 14400
  inference:
    alpha: 0.05
    block_bootstrap_min_block_seconds: 14400
    bootstrap_repetitions: 1000
    confidence_level: 0.95
    multiple_testing_method: holm
    random_seed: 42
  label_start: feature_or_state_actual_available_time
  mfe_mae_grid_seconds: 1
  quote_alignment: backward_asof_with_max_age
  report_all_horizons: true
  report_common_event_sample: false
  return_definition: log_return_bps
  split:
    method: walk_forward
    minimum_boundary_buffer_seconds: 14400
    purge_by_actual_label_intervals: true
    shuffle: false
    step_days: 7
    test_days: 7
    train_days: 30
    validation_days: 7
spec_version: '0.1'
states:
  absorption:
    high_side_volume_quantile: 0.9
    lookback_seconds: 30
    low_past_excursion_quantile: 0.25
    low_response_quantile: 0.25
    require_l2_confirmation: false
    require_oi_expansion: false
  allow_unknown: true
  context_lookback_seconds: 300
  dead_zone_abs_change_quantile: 0.2
  enabled: true
  event_cooldown_seconds: 60
  freeze_thresholds_in_validation_and_test: true
  thresholds_fit_on: training_fold_only
storage:
  compression: zstd
  delete_raw_automatically: false
  disk_stop_gib: 2
  disk_warning_gib: 10
  normalized_format: parquet
  raw_commit_interval_seconds: 1
  root: ./data
  source_payload_preserved: true
streams:
  liquidation_required_for_core: false
  rpi_depth_enabled: false
  spot:
  - btcusdt@aggTrade
  - btcusdt@bookTicker
  spot_full_depth_enabled: false
  um_market:
  - btcusdt@aggTrade
  - btcusdt@markPrice@1s
  - btcusdt@forceOrder
  um_public:
  - btcusdt@bookTicker
  - btcusdt@depth@100ms
